<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
<title id="title">DSP Control Flotte</title>
<desc id="desc">Emblème premium bleu nuit et chrome, bouclier avec route orange intégrée au monogramme DSP.</desc>
<defs>
 <linearGradient id="chrome" x1="0" y1="0" x2="0.15" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#b9c8d8"/><stop offset=".38" stop-color="#f8fbff"/><stop offset=".62" stop-color="#73869b"/><stop offset=".82" stop-color="#e6edf5"/><stop offset="1" stop-color="#8798aa"/>
 </linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152d52"/><stop offset="1" stop-color="#07162d"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb02e"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e94a00"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g transform="translate(16 12)">
